[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gigapan-salvager"
version = "0.9.1"
description = "Resumable preservation of public GigaPan tile pyramids and metadata"
requires-python = ">=3.10"
dependencies = ["requests>=2.32,<3", "Pillow>=11,<13"]
license = "MIT"

[project.scripts]
gigapan-salvage = "gigapan_salvager.cli:main"

[tool.setuptools.package-data]
gigapan_salvager = ["viewer.html"]
