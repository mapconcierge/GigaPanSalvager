name: Salvage GigaPan
run-name: 'GigaPan ${{ inputs.gigapan_id || github.event.issue.title }} · ${{ inputs.mode || github.event_name }}'
on:
  workflow_dispatch:
    inputs:
      gigapan_id:
        description: GigaPan ID（例 76564）。カンマ・空白区切りで複数指定すると1件ずつ順番に救出
        required: true
        type: string
      mode:
        description: full は全タイル、probe はメタデータと1枚だけの通信確認
        required: true
        default: full
        type: choice
        options: [full, probe]
      width:
        description: API 停止時の補助・画像の横幅（任意・1件のときのみ）
        type: string
      height:
        description: API 停止時の補助・画像の高さ（任意・1件のときのみ）
        type: string
  issues:
    types: [opened, reopened]
permissions:
  contents: read
concurrency:
  group: salvage-${{ github.event.issue.number || inputs.gigapan_id }}
  cancel-in-progress: false
jobs:
  plan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.issue.title, '[Salvage] GigaPan ') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ids: ${{ steps.request.outputs.ids }}
      count: ${{ steps.request.outputs.count }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Validate request and permissions
        id: request
        run: python scripts/prepare_request.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

  salvage:
    needs: plan
    name: GigaPan ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
    strategy:
      # One panorama at a time; the next starts when the previous one finishes, even if it was incomplete.
      max-parallel: 1
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Select this panorama from the request
        id: request
        run: python scripts/prepare_request.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PICK_ID: ${{ matrix.id }}
      - name: Restore previously saved tiles
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: archives/gigapan_${{ steps.request.outputs.id }}
          key: salvage-v1-${{ steps.request.outputs.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: salvage-v1-${{ steps.request.outputs.id }}-
      - name: Download and verify
        id: rescue
        continue-on-error: true
        run: python -u scripts/run_job.py
      - name: Save archive and report
        if: always() && steps.request.outcome == 'success'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gigapan-${{ steps.request.outputs.id }}-${{ github.run_id }}
          path: |
            archives/*.tar.gz
            archives/*.sha256
            archives/job-result.json
            archives/gigapan_${{ steps.request.outputs.id }}/docs/audit.json
            archives/gigapan_${{ steps.request.outputs.id }}/docs/missing_tiles.json
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
      - name: Report result
        id: result
        if: always() && steps.request.outcome == 'success'
        run: python scripts/finish_job.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BATCH_TOTAL: ${{ needs.plan.outputs.count }}
      - name: Keep the result for the batch summary
        if: always() && steps.result.outcome == 'success'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: result-${{ steps.request.outputs.id }}
          path: work/result.json
          retention-days: 30
      - name: Keep partial progress for the next run
        if: always() && steps.result.outputs.cache_ok == 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: archives/gigapan_${{ steps.request.outputs.id }}
          key: salvage-v1-${{ steps.request.outputs.id }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Mark incomplete salvage as failed
        if: always() && steps.rescue.outcome == 'failure'
        run: exit 1

  summary:
    needs: [plan, salvage]
    if: always() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.count) > 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: result-*
          path: results
          merge-multiple: false
      - name: Report batch summary
        run: python scripts/summarize_batch.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BATCH_IDS: ${{ needs.plan.outputs.ids }}
